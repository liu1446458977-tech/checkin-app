name: Build APK

# 方案 A：云端构建。以后不用在本地装任何工具链。
#   - 打 tag（如 v1.2.1）→ 自动构建并把 APK 挂到 GitHub Release，手机直接下载
#   - 也可以在 Actions 页面手动触发（workflow_dispatch），产物在 Artifacts 里
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write        # 需要它才能把 APK 挂到 Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 取代码
        uses: actions/checkout@v4

      - name: 装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 重要：不要设置 android.builtInKotlin=false。
      # 本项目依赖 AGP 9 的内置 Kotlin；它一旦被关掉，
      # workmanager 等插件的 Kotlin 类就不会编译，会报「找不到符号 WorkmanagerPlugin」。
      - name: 拉依赖
        run: flutter pub get

      - name: 静态检查
        run: flutter analyze --no-pub

      - name: 单元测试
        run: flutter test

      - name: 构建 release APK（arm64 + arm32）
        run: flutter build apk --release --target-platform android-arm64,android-arm

      - name: 上传产物（手动触发时在这里下载）
        uses: actions/upload-artifact@v4
        with:
          name: checkin-app-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: 挂到 Release（打 tag 时）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk

# ── 备注 ──
# 1) 目前 release 用 debug 签名（见 android/app/build.gradle.kts），可以直接安装。
#    想换成自己的签名：把 keystore 转成 base64 放进 Secrets，
#    在构建前解码成 android/app/release.jks，并添加 key.properties。
# 2) 本项目不需要本机那套 arm64 绕过（box64/gen_snapshot 包装、strip shim）——
#    那些只是那台安卓平板容器的权宜之计，CI 是正常 x86_64 环境，原生就能编。
