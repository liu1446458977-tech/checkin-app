# ============================================================================
# Windows / x86_64 本机构建参数（本机：16 核 / 15GB 内存 / 项目在 D 盘）
#
# 这个文件原来是为「安卓平板 Linux 容器」调的：堆 1.5G、并行关闭、worker=2，
# 还有一条指向容器内 arm64 aapt2 的覆盖路径。在 Windows 上它会连环失败。
# 下面每一行都是踩过坑之后定下来的，改之前先看注释。
# ============================================================================

# 内存：本机 15GB，Gradle 4G + Kotlin 守护进程 2G 足够
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2g

# 并行 + 构建缓存：16 核机器上收益很大
org.gradle.parallel=true
org.gradle.caching=true
# 不用 8：Gradle + Kotlin 守护进程 + Dart AOT 同时抢内存容易「守护进程消失」，
# 4 个 worker 已经能跑满编译，稳定性优先。
org.gradle.workers.max=4

# ⚠️ Windows 上必须关掉文件系统监视：Gradle 的 VFS watch 在 Windows 上
# 会因句柄耗尽 / 杀软扫描导致构建随机失败。
org.gradle.vfs.watch=false

android.useAndroidX=true

# ⚠️ Windows 跨盘符的 Kotlin 增量编译 bug：
# Kotlin 增量编译器要算「源码相对路径」，插件源码和项目不在同一个盘根时直接抛
#   IllegalArgumentException: this and base files have different roots
# 本项目已把 pub 缓存也挪到 D 盘（PUB_CACHE=D:\PubCache），这里再关掉增量编译做双保险。
kotlin.incremental=false

# ⚠️ Kotlin 编译**不用独立守护进程**，直接在 Gradle 进程里跑（in-process）：
# 独立 Kotlin 守护进程在 Windows 上会与 Gradle 守护进程抢资源，
# 并且增量缓存一旦损坏就会出现「JVM 全程 0 CPU、不写盘、也不报错」的死等，
# 一挂就是十几分钟。本工程只有 shared_preferences_android 一个 Kotlin 模块，
# in-process 编译只要几秒，彻底消灭这类死等。
kotlin.compiler.execution.strategy=in-process

# This newDsl flag was added by the Flutter template
android.newDsl=false

# AGP 9 的内置 Kotlin：shared_preferences_android / sqflite_android 这些插件
# 不自己应用 KGP，靠它编译插件里的 Kotlin 类，所以必须保持 true。
android.builtInKotlin=true

# ⚠️ 关掉 AGP 的 SDK 自动下载：
# 它每次构建都会去 dl.google.com 拉「package manifests」，国内经常一卡十几分钟
# （日志表现为 "Still waiting for package manifests to be fetched remotely"），
# 之后还会触发 NDK 那种 1GB 级下载。本机需要的组件已全部手工装好并核对：
#   platforms: android-35 / android-36 / android-37.0
#   build-tools: 36.0.0        ndk: 28.2.13676358        platform-tools: adb ✓
# 真的缺组件时会直接报错（快速失败），比卡住十几分钟强。
android.builder.sdkDownload=false

android.enableResourceOptimizations=false
android.experimental.enableOptimizedResourceShrinking=false

# ⚠️ 这里以前有一行（已删除）：
#   android.aapt2FromMavenOverride=/home/honor/tools/aapt2-arm64/aapt2
# 指向平板容器里的 arm64 版 aapt2。Windows 上该路径不存在，AGP 会报
#   「Custom AAPT2 location does not point to an AAPT2 executable」直接失败。
# 现在用 build-tools 自带的原生 aapt2。
